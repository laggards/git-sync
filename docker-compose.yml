services:
  git-sync:
    image: git-sync:latest
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    init: true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    tmpfs:
      - /tmp:mode=1777,size=16m
    environment:
      APP_CONFIG: /config/config.json
      STATE_DIR: /state
      WORKSPACE_DIR: /workspace
      GIT_PRIVATE_KEY: ${GIT_PRIVATE_KEY:?请在环境变量中配置 SSH 私钥}
      GIT_KNOWN_HOSTS: ${GIT_KNOWN_HOSTS:?请在环境变量中配置 SSH 主机公钥}
    ports:
      - "8080:8080"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/healthz', timeout=3).read()"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    volumes:
      - /data/git-sync/config.json:/config/config.json:rw
      - /data/git-sync/state:/state
      - /data/workspaces:/workspace
